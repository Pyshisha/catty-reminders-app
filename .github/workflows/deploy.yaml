name: Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yaml,config.json"
          target: "/home/${{ secrets.SSH_USER }}/catty-reminders-app"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          timeout: 30s
          script: |
            cd /home/${{ secrets.SSH_USER }}/catty-reminders-app

            export DEPLOY_REF=${{ github.sha }}
            export OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            export IMAGE=ghcr.io/$OWNER/catty-reminders-app:${{ github.sha }}
            export MARIADB_ROOT_PASSWORD=${{ secrets.DB_PASS }}
            export MARIADB_USER=${{ secrets.SSH_USER }}
            export MARIADB_PASSWORD=${{ secrets.DB_PASS }}
            export MARIADB_DATABASE=catty_reminders

            export HOST_DB_PORT=3306
            export CONTAINER_DB_PORT=3306
            export HOST_APP_PORT=8181
            export CONTAINER_APP_PORT=8181
            export APP_CONTAINER_NAME=catty-app
            export DB_CONTAINER_NAME=catty-db

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose pull
            docker compose up -d --remove-orphans --force-recreate
